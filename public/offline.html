        a { display: inline-flex; min-height: 42px; align-items: center; padding: 0 16px; border-radius: 4px; background: #14213d; color: #fff; font: 700 .9rem system-ui, sans-serif; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img src="/assets/brand/sushako-shopping-official-icon-192.png" alt="Sushako">
